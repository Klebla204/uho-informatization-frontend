<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión | BiblioUHO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#1b2735;--muted:#667582;--navy:#102a43;--blue:#245b78;--line:#dce4e7;--green:#28704a;--red:#a9473d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:'DM Sans',sans-serif;color:var(--ink);background:#f5f7f8;line-height:1.5}
header{height:64px;display:flex;align-items:center;padding:0 clamp(20px,5vw,76px);background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:Manrope,sans-serif;font-weight:800;font-size:17px;color:var(--navy)}
.brand strong{color:var(--blue)}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--navy);color:#fff;border-radius:4px;font-size:9px;letter-spacing:.04em}
main{flex:1;display:grid;place-items:center;padding:32px 16px;background:linear-gradient(112deg,#102a43 0%,#1d4d67 63%,#36746f 100%)}
.card{width:min(100%,400px);padding:32px 28px;background:#fff;border-radius:8px;box-shadow:0 12px 32px #0e223340}
.kicker{margin:0;color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
h1{margin:6px 0 4px;font-family:Manrope,sans-serif;font-size:26px;font-weight:800;color:var(--navy)}
.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
label{display:block;margin:14px 0 6px;font-size:12px;font-weight:600;color:#3b4b59}
input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:5px;font:inherit;font-size:14px;color:var(--ink);outline:0}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #245b7826}
button{width:100%;height:46px;margin-top:22px;border:0;border-radius:5px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--navy)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:16px;padding:10px 12px;border-radius:5px;font-size:13px;display:none}
.msg.error{display:block;background:#f8e9e7;color:var(--red)}
.msg.ok{display:block;background:#e6f2ea;color:var(--green)}
pre{margin:10px 0 0;white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--ink)}
.api{margin-top:18px;font-size:11px;color:var(--muted)}
.api input{height:34px;font-size:12px}
</style>
</head>
<body>
<header><div class="brand"><span class="brand-mark">UHO</span><span>Biblio<strong>UHO</strong></span></div></header>
<main>
  <form class="card" id="form" autocomplete="on">
    <p class="kicker">Acceso institucional</p>
    <h1>Iniciar sesión</h1>
    <p class="sub">Usa tu usuario de la universidad o una cuenta local.</p>
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit">Entrar</button>
    <div class="msg" id="msg" role="status"></div>
    <div class="api">
      <label for="api" style="margin-top:0">URL del backend</label>
      <input id="api" value="http://localhost:8000">
    </div>
  </form>
</main>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit');

function show(type, html) { msg.className = 'msg ' + type; msg.innerHTML = html; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  btn.disabled = true;
  const base = document.getElementById('api').value.replace(/\/+$/, '');
  try {
    const res = await fetch(base + '/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      show('error', res.status === 401 ? 'Usuario o contraseña incorrectos.' : 'Error ' + res.status);
      return;
    }
    sessionStorage.setItem('uho_auth', JSON.stringify(data));
    const name = [data.nombre, data.apellidos].filter(Boolean).join(' ') || data.username;
    show('ok', 'Sesión iniciada: <b></b>. Redirigiendo…');
    msg.querySelector('b').textContent = name;
    const staff = ['BIBLIOTECARIO', 'ADMINISTRADOR', 'SUPER_ADMIN'].includes(data.tipo_usuario) || data.is_staff;
    const pendingBook = sessionStorage.getItem('uho_pending_book');
    sessionStorage.removeItem('uho_pending_book');
    const superAdmin = data.tipo_usuario === 'SUPER_ADMIN' || (data.roles || []).includes('super_admin');
    const administrator = data.tipo_usuario === 'ADMINISTRADOR';
    window.location.href = superAdmin ? 'src/pages/super-admin.html'
      : administrator ? 'src/pages/administrador.html'
      : staff ? 'src/pages/bibliotecario.html'
      : pendingBook ? 'src/pages/panel-usuario.html?libro=' + encodeURIComponent(pendingBook)
      : 'src/pages/panel-usuario.html';
  } catch {
    show('error', 'No se pudo conectar con el backend. Verifica que esté en ejecución y el CORS.');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
