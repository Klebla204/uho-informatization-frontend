<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catálogo público | BiblioUHO</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .hero{padding:30px;color:white;background:linear-gradient(115deg,#102542,#1a3a6b 70%,#24706e);border:0}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0 0 18px;color:#d4dfec;font-size:13px}.search-row{display:flex;gap:8px;max-width:700px}.search-row .input{flex:1}.stats{display:flex;gap:28px;margin-top:18px;font-size:11px;color:#d3ddec}.stats strong{display:block;color:white;font-size:18px}.catalog-layout{display:grid;grid-template-columns:210px 1fr;gap:18px;margin-top:18px}.filter-section{padding:0 0 16px;margin:0 0 16px;border-bottom:1px solid var(--line)}.filter-section:last-child{border:0}.filter-title{margin-bottom:8px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.filter-option{display:flex;gap:7px;align-items:center;margin:8px 0;color:var(--ink-soft);font-size:11px}.filter-option input{accent-color:var(--blue)}.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.book-card{overflow:hidden;padding:0;text-align:left;cursor:pointer;color:inherit}.book-card:hover{transform:translateY(-2px)}.book-cover{display:grid;height:118px;place-items:center;font-size:38px}.book-data{display:block;padding:12px}.book-data h2{margin:0 0 4px;font-size:12px;line-height:1.4}.book-data p{margin:0 0 9px;color:var(--muted);font-size:11px}.results-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:12px;color:var(--muted)}
    @media(max-width:700px){.catalog-layout{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.filter-section{padding:12px;margin:0;border:1px solid var(--line);border-radius:8px;background:#fff}.hero{padding:22px}.stats{gap:16px}.book-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body class="page-shell">
  <header class="topbar"><a class="brand" href="#inicio" aria-label="BiblioUHO">Biblio<span>UHO</span></a><span class="topbar-title">Catálogo público · Acceso libre</span></header>
  <main class="page-main" id="inicio">
    <section class="hero panel"><h1>Catálogo de Bibliotecas<br>Universidad de Holguín</h1><p>Explora títulos y disponibilidad en las bibliotecas de la UHO.</p><form id="searchForm" class="search-row"><input class="input" id="searchInput" type="search" placeholder="Buscar por título, autor o ISBN" aria-label="Buscar libros"><button class="button" type="submit">Buscar</button></form><div class="stats"><div><strong>4,280</strong>Títulos</div><div><strong>12,940</strong>Ejemplares</div><div><strong>4</strong>Bibliotecas</div></div></section>
    <div class="catalog-layout">
      <aside class="filters panel" aria-label="Filtros del catálogo">
        <section class="filter-section"><div class="filter-title">Biblioteca</div><label class="filter-option"><input type="checkbox" name="library" value="Central"> Central</label><label class="filter-option"><input type="checkbox" name="library" value="Facultad Técnica"> Facultad Técnica</label><label class="filter-option"><input type="checkbox" name="library" value="Ciencias Sociales"> Ciencias Sociales</label><label class="filter-option"><input type="checkbox" name="library" value="Ciencias Naturales"> Ciencias Naturales</label></section>
        <section class="filter-section"><div class="filter-title">Categoría</div><label class="filter-option"><input type="checkbox" name="category" value="Ciencias Técnicas"> Ciencias Técnicas</label><label class="filter-option"><input type="checkbox" name="category" value="Humanidades"> Humanidades</label><label class="filter-option"><input type="checkbox" name="category" value="Literatura"> Literatura</label><label class="filter-option"><input type="checkbox" name="category" value="Ciencias Sociales"> Ciencias Sociales</label></section>
        <section class="filter-section"><div class="filter-title">Disponibilidad</div><label class="filter-option"><input id="availableOnly" type="checkbox"> Solo disponibles</label></section>
      </aside>
      <section aria-label="Resultados del catálogo"><div class="results-head"><span id="resultCount" aria-live="polite"></span><button id="clearFilters" class="button secondary" type="button">Limpiar filtros</button></div><div id="bookGrid" class="book-grid"></div><p id="emptyState" class="empty-state panel" hidden>No se encontraron libros con esos filtros.</p></section>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const books=[
      {title:'Fundamentos de Programación',author:'Luis Joyanes Aguilar',isbn:'978-84-415-3746-1',category:'Ciencias Técnicas',library:'Central',available:3,icon:'📘',color:'#dbeafe'},
      {title:'Álgebra Lineal y sus Aplicaciones',author:'David C. Lay',isbn:'978-84-205-5000-4',category:'Ciencias Técnicas',library:'Facultad Técnica',available:2,icon:'📗',color:'#dcfce7'},
      {title:'Sistemas Operativos Modernos',author:'Andrew Tanenbaum',isbn:'978-607-32-4338-4',category:'Ciencias Técnicas',library:'Central',available:0,icon:'📙',color:'#fef3c7'},
      {title:'Historia de Cuba Contemporánea',author:'García Álvarez',isbn:'978-959-02-1000-2',category:'Humanidades',library:'Ciencias Sociales',available:5,icon:'📕',color:'#fee2e2'},
      {title:'Introducción a la Inteligencia Artificial',author:'Russell y Norvig',isbn:'978-84-205-4000-5',category:'Ciencias Técnicas',library:'Facultad Técnica',available:1,icon:'📒',color:'#ede9fe'},
      {title:'Redes de Computadoras',author:'Andrew Tanenbaum',isbn:'978-607-32-4450-3',category:'Ciencias Técnicas',library:'Ciencias Naturales',available:0,icon:'📔',color:'#cffafe'},
      {title:'Cálculo Diferencial e Integral',author:'Ron Larson',isbn:'978-607-32-3924-0',category:'Ciencias Técnicas',library:'Central',available:4,icon:'📓',color:'#f0fdf4'},
      {title:'Economía Política',author:'Paul Samuelson',isbn:'978-84-206-8960-0',category:'Ciencias Sociales',library:'Ciencias Sociales',available:0,icon:'📃',color:'#fce7f3'}
    ];
    const searchInput=document.getElementById('searchInput');const grid=document.getElementById('bookGrid');const toast=document.getElementById('toast');let toastTimer;
    function showToast(message){toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2600)}
    function renderBooks(){const query=searchInput.value.trim().toLocaleLowerCase('es');const libraries=[...document.querySelectorAll('[name="library"]:checked')].map(input=>input.value);const categories=[...document.querySelectorAll('[name="category"]:checked')].map(input=>input.value);const availableOnly=document.getElementById('availableOnly').checked;const filtered=books.filter(book=>(!query||`${book.title} ${book.author} ${book.isbn}`.toLocaleLowerCase('es').includes(query))&&(!libraries.length||libraries.includes(book.library))&&(!categories.length||categories.includes(book.category))&&(!availableOnly||book.available>0));document.getElementById('resultCount').textContent=`${filtered.length} títulos`;document.getElementById('emptyState').hidden=filtered.length>0;grid.innerHTML=filtered.map(book=>`<button class="book-card panel" type="button" data-book="${books.indexOf(book)}"><span class="book-cover" style="background:${book.color}">${book.icon}</span><span class="book-data"><h2>${book.title}</h2><p>${book.author}</p><span class="status ${book.available?'good':'bad'}">${book.available?`${book.available} disponibles`:'No disponible'}</span></span></button>`).join('')}
    document.getElementById('searchForm').addEventListener('submit',event=>{event.preventDefault();renderBooks()});searchInput.addEventListener('input',renderBooks);document.querySelectorAll('[name="library"],[name="category"],#availableOnly').forEach(input=>input.addEventListener('change',renderBooks));document.getElementById('clearFilters').addEventListener('click',()=>{document.querySelectorAll('.filters input').forEach(input=>input.checked=false);searchInput.value='';renderBooks()});grid.addEventListener('click',event=>{const card=event.target.closest('[data-book]');if(card)showToast(`Libro seleccionado: ${books[Number(card.dataset.book)].title}`)});renderBooks();
  </script>
</body>
</html>
