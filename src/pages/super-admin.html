<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roles y permisos | BiblioUHO</title>
<link rel="stylesheet" href="../styles/shared.css">
<style>
.rbac-layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 58px)}.rbac-side{padding:18px 12px;color:#fff;background:var(--blue)}.rbac-identity{padding:4px 8px 18px;border-bottom:1px solid #ffffff26;font-size:13px;font-weight:700}.rbac-identity small{display:block;margin-top:4px;color:#c8d5e6;font-size:10px;font-weight:400}.rbac-nav{display:grid;gap:5px;margin-top:14px}.rbac-nav button{padding:10px;text-align:left;border:0;border-radius:5px;background:transparent;color:#e3ebf5;font:11px 'Sora',sans-serif;cursor:pointer}.rbac-nav button:hover,.rbac-nav button[aria-current=true]{background:#ffffff1c;color:white}.rbac-content{padding:22px;min-width:0}.rbac-section{display:none}.rbac-section.active{display:block}.admin-embed{display:block;width:100%;height:calc(100vh - 102px);min-height:700px;border:0;background:transparent}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}.toolbar .input{flex:1 1 220px}.rbac-table{width:100%;border-collapse:collapse;font-size:12px}.rbac-table th,.rbac-table td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}.rbac-table th{color:var(--muted);font-size:9px;text-transform:uppercase}.permission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.module-section{padding:12px;border:1px solid var(--line);border-radius:5px;background:#fff}.module-section h3{margin:0 0 8px;text-transform:capitalize;color:var(--navy);font-size:13px}.permission-option{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:11px}.permission-option input{margin:1px 0}.role-modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:#0f172a88}.role-modal[hidden]{display:none}.role-dialog{width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;background:#fff;border-radius:7px}.role-dialog h2{margin:0 0 16px;font-size:18px;color:var(--navy)}.role-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;margin-bottom:5px;font-size:10px;font-weight:700;color:var(--ink-soft)}.field.full{grid-column:1/-1}.role-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.user-card{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,240px) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.user-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.assignment-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.assignment{display:flex;gap:6px;align-items:center;padding:4px 7px;border:1px solid var(--line);border-radius:4px;font-size:10px}.assignment button{border:0;background:transparent;color:#a33;cursor:pointer}.empty{padding:22px;text-align:center;color:var(--muted)}
@media(max-width:720px){.rbac-layout{grid-template-columns:1fr}.rbac-side{padding:12px}.rbac-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.rbac-content{padding:16px 12px}.admin-embed{height:calc(100vh - 156px);min-height:650px}.user-card{grid-template-columns:1fr}.role-form{grid-template-columns:1fr}.field.full{grid-column:auto}.rbac-table{min-width:640px}}
</style>
</head>
<body class="page-shell">
<header class="topbar"><a class="brand" href="catalogo.html">Biblio<span>UHO</span></a><span class="topbar-title">Administración de roles y permisos</span><button type="button" class="button secondary" id="logout">Cerrar sesión</button></header>
<div class="rbac-layout"><aside class="rbac-side"><div class="rbac-identity"><span id="adminName"></span><small>Super-Admin · Administración</small></div><nav class="rbac-nav" aria-label="Administración"><button type="button" data-section="roles" aria-current="true">Roles y permisos</button><button type="button" data-section="users">Asignar roles</button><button type="button" data-section="catalog">Títulos</button><button type="button" data-section="reports">Reportes</button><button type="button" data-section="audit">Auditoría</button></nav></aside>
<main class="rbac-content">
<section id="section-roles" class="rbac-section active"><h1 class="page-heading">Roles y permisos</h1><p class="page-lead">Define el acceso por módulo y acción.</p><div class="toolbar"><input id="roleSearch" class="input" type="search" placeholder="Buscar rol"><button id="newRole" class="button" type="button">＋ Crear rol</button></div><div class="panel" style="overflow:auto"><table class="rbac-table"><thead><tr><th>Rol</th><th>Tipo</th><th>Permisos</th><th>Acciones</th></tr></thead><tbody id="roleRows"></tbody></table><p id="rolesEmpty" class="empty" hidden>No hay roles registrados.</p></div></section>
<section id="section-users" class="rbac-section"><h1 class="page-heading">Asignar roles</h1><p class="page-lead">Busca usuarios activos por usuario, nombre o correo.</p><div class="toolbar"><input id="userSearch" class="input" type="search" placeholder="Usuario, nombre o correo"></div><div id="userRows" class="panel" style="padding:0 14px"><p class="empty">Los usuarios aparecerán aquí.</p></div></section>
<section id="section-catalog" class="rbac-section"><iframe class="admin-embed" title="Gestión de títulos" data-src="administrador.html?embed=1" loading="lazy"></iframe></section>
<section id="section-reports" class="rbac-section"><iframe class="admin-embed" title="Reportes y estadísticas" data-src="reportes.html?embed=1" loading="lazy"></iframe></section>
<section id="section-audit" class="rbac-section"><iframe class="admin-embed" title="Registro de auditoría" data-src="auditoria.html?embed=1" loading="lazy"></iframe></section>
</main></div>
<div id="roleModal" class="role-modal" hidden><section class="role-dialog" role="dialog" aria-modal="true" aria-labelledby="roleFormTitle"><h2 id="roleFormTitle">Crear rol</h2><form id="roleForm"><input id="roleId" type="hidden"><div class="role-form"><div class="field"><label for="roleName">IDENTIFICADOR *</label><input id="roleName" class="input" required maxlength="100" placeholder="ej. gestor_inventario"></div><div class="field"><label for="roleDisplay">NOMBRE VISIBLE *</label><input id="roleDisplay" class="input" required maxlength="200"></div><div class="field full"><label for="roleDescription">DESCRIPCIÓN</label><textarea id="roleDescription" class="input"></textarea></div><div class="field full"><label>PERMISOS POR MÓDULO</label><div id="permissionGrid" class="permission-grid"></div></div></div><div class="role-actions"><button class="button secondary" type="button" id="cancelRole">Cancelar</button><button class="button" type="submit" id="saveRole">Guardar rol</button></div></form></section></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const BASE='/api/v1/admin/rbac';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null;try{session=JSON.parse(sessionStorage.getItem('uho_auth'))}catch{}
const isSuperAdmin=session?.tipo_usuario==='SUPER_ADMIN'||(session?.roles||[]).includes('super_admin');
if(!session?.access||!isSuperAdmin)location.replace('../../login.html');
$('adminName').textContent=[session?.nombre,session?.apellidos].filter(Boolean).join(' ')||session?.username||'';
$('logout').addEventListener('click',()=>{sessionStorage.removeItem('uho_auth');location.href='catalogo.html'});
let timer;function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
function headers(json=true){return {...(json?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+session.access}}
async function api(path,options={}){
  let response=await fetch('http://localhost:8000'+path,{...options,headers:{...headers(),...(options.headers||{})}});
  if(response.status===401&&session.refresh){const refresh=await fetch('http://localhost:8000/api/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:session.refresh})});if(refresh.ok){session.access=(await refresh.json()).access;sessionStorage.setItem('uho_auth',JSON.stringify(session));response=await fetch('http://localhost:8000'+path,{...options,headers:{...headers(),...(options.headers||{})}})}}
  if(response.status===401){sessionStorage.removeItem('uho_auth');location.replace('../../login.html')}
  return response;
}
async function errorText(response){const data=await response.json().catch(()=>({}));return data.detail||Object.entries(data).map(([key,value])=>`${key}: ${Array.isArray(value)?value.join(', '):value}`).join(' · ')||`Error HTTP ${response.status}`}
let roles=[],permissions=[],users=[],allAssignments=[];
const moduleFor=name=>name.split('.',1)[0];
function renderRoles(){const query=$('roleSearch').value.trim().toLocaleLowerCase('es');const rows=roles.filter(role=>`${role.name} ${role.display_name}`.toLocaleLowerCase('es').includes(query));$('rolesEmpty').hidden=rows.length>0;$('roleRows').innerHTML=rows.map(role=>`<tr><td><strong>${esc(role.display_name||role.name)}</strong><small style="display:block;color:var(--muted)">${esc(role.name)}</small></td><td>${role.is_system?'Predefinido':'Personalizado'}</td><td>${(role.permission_details||[]).length} permisos</td><td><div class="actions"><button class="button secondary" data-edit-role="${role.id}" type="button">Configurar</button>${role.is_system?'':'<button class="button danger" data-delete-role="'+role.id+'" type="button">Eliminar</button>'}</div></td></tr>`).join('')}
function renderPermissionGrid(selected=[]){const modules={};permissions.forEach(permission=>(modules[permission.module]??=[]).push(permission));$('permissionGrid').innerHTML=Object.entries(modules).map(([module,items])=>`<section class="module-section"><h3>${esc(module)}</h3>${items.map(item=>`<label class="permission-option"><input type="checkbox" value="${item.id}" ${selected.includes(item.id)?'checked':''}><span><strong>${esc(item.action)}</strong><br><span style="color:var(--muted)">${esc(item.description||item.name)}</span></span></label>`).join('')}</section>`).join('')||'<p class="empty">No hay permisos registrados.</p>'}
function openRole(role=null){$('roleForm').reset();$('roleId').value=role?.id||'';$('roleName').value=role?.name||'';$('roleDisplay').value=role?.display_name||'';$('roleDescription').value=role?.description||'';$('roleName').readOnly=!!role?.is_system;$('roleFormTitle').textContent=role?'Configurar rol':'Crear rol';renderPermissionGrid(role?.permission_ids||[]);$('roleModal').hidden=false}
async function loadRoles(){const response=await api(BASE+'/roles/');if(!response.ok)throw new Error(await errorText(response));roles=await response.json();renderRoles()}
async function loadPermissions(){const response=await api(BASE+'/permisos/');if(!response.ok)throw new Error(await errorText(response));permissions=(await response.json()).results}
async function loadAssignments(){const response=await api(BASE+'/asignaciones/');if(!response.ok)throw new Error(await errorText(response));allAssignments=await response.json()}
$('newRole').addEventListener('click',()=>openRole());$('cancelRole').addEventListener('click',()=>$('roleModal').hidden=true);$('roleModal').addEventListener('click',event=>{if(event.target===$('roleModal'))$('roleModal').hidden=true});$('roleSearch').addEventListener('input',renderRoles);
$('roleRows').addEventListener('click',async event=>{const edit=event.target.closest('[data-edit-role]');const remove=event.target.closest('[data-delete-role]');if(edit){openRole(roles.find(role=>String(role.id)===edit.dataset.editRole));return}if(remove){const role=roles.find(item=>String(item.id)===remove.dataset.deleteRole);if(!confirm(`¿Eliminar el rol «${role.display_name||role.name}»?`))return;const response=await api(`${BASE}/roles/${role.id}/`,{method:'DELETE'});if(!response.ok){notify(await errorText(response));return}notify('Rol eliminado.');await loadRoles()}});
$('roleForm').addEventListener('submit',async event=>{event.preventDefault();const roleId=$('roleId').value;const payload={name:$('roleName').value.trim(),display_name:$('roleDisplay').value.trim(),description:$('roleDescription').value.trim(),permissions:[...$('permissionGrid').querySelectorAll('input:checked')].map(input=>Number(input.value))};const button=$('saveRole');button.disabled=true;try{const response=await api(`${BASE}/roles/${roleId?roleId+'/':''}`,{method:roleId?'PATCH':'POST',body:JSON.stringify(payload)});if(!response.ok)throw new Error(await errorText(response));$('roleModal').hidden=true;notify(roleId?'Permisos actualizados.':'Rol creado.');await loadRoles()}catch(error){notify(error.message||'No se pudo guardar el rol.')}finally{button.disabled=false}});
let searchTimer;async function searchUsers(){const query=$('userSearch').value.trim();if(query.length===1){$('userRows').innerHTML='<p class="empty">Escribe al menos dos caracteres o borra el texto para ver todos los usuarios.</p>';return}try{$('userRows').innerHTML='<p class="empty">Cargando usuarios…</p>';const search=query?`?q=${encodeURIComponent(query)}`:'';const response=await api(`${BASE}/usuarios/${search}`);if(!response.ok)throw new Error(await errorText(response));users=await response.json();renderUsers()}catch(error){$('userRows').innerHTML=`<p class="empty">${esc(error.message)}</p>`}}
function renderUsers(){if(!users.length){$('userRows').innerHTML='<p class="empty">No se encontraron usuarios activos.</p>';return}$('userRows').innerHTML=users.map(user=>{const assignments=allAssignments.filter(item=>item.user===user.id);return `<article class="user-card"><div><strong>${esc([user.nombre,user.apellidos].filter(Boolean).join(' ')||user.auth_uid)}</strong><small>${esc(user.auth_uid)} · ${esc(user.email)} · ${esc(user.tipo_usuario)}</small><div class="assignment-list">${assignments.map(item=>`<span class="assignment">${esc(item.role_display_name||item.role_name)}<button type="button" aria-label="Retirar ${esc(item.role_display_name||item.role_name)}" data-unassign="${item.id}">×</button></span>`).join('')||'<small>Sin roles asignados</small>'}</div></div><select class="select" data-role-select="${user.id}" aria-label="Seleccionar rol"><option value="">Selecciona rol…</option>${roles.map(role=>`<option value="${role.id}">${esc(role.display_name||role.name)}</option>`).join('')}</select><button class="button secondary" data-assign="${user.id}" type="button">Asignar</button></article>`}).join('')}
$('userSearch').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchUsers,240)});
$('userRows').addEventListener('click',async event=>{const assign=event.target.closest('[data-assign]');const unassign=event.target.closest('[data-unassign]');try{let response;if(assign){const userId=assign.dataset.assign;const roleId=$('userRows').querySelector(`[data-role-select="${CSS.escape(userId)}"]`).value;if(!roleId){notify('Selecciona un rol.');return}response=await api(BASE+'/asignaciones/',{method:'POST',body:JSON.stringify({user:userId,role:Number(roleId)})})}else if(unassign){response=await api(`${BASE}/asignaciones/${unassign.dataset.unassign}/`,{method:'DELETE'})}else return;if(!response.ok)throw new Error(await errorText(response));notify(assign?'Rol asignado.':'Asignación retirada.');await loadAssignments();renderUsers()}catch(error){notify(error.message||'No se pudo actualizar la asignación.')}});
document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',async()=>{document.querySelectorAll('[data-section]').forEach(item=>{item.removeAttribute('aria-current');document.getElementById(`section-${item.dataset.section}`).classList.remove('active')});button.setAttribute('aria-current','true');const section=document.getElementById(`section-${button.dataset.section}`);section.classList.add('active');if(button.dataset.section==='users'){await Promise.all([loadAssignments(),searchUsers()])}const frame=section.querySelector('iframe[data-src]');if(frame){frame.src=frame.dataset.src;frame.removeAttribute('data-src')}}));
(async()=>{if(!session?.access||!isSuperAdmin)return;try{await Promise.all([loadRoles(),loadPermissions()])}catch(error){notify(error.message||'No se pudo cargar RBAC.')}})();
</script>
</body>
</html>
